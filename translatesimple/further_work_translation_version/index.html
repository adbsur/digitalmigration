    PLEASE SKIM READ AT LEAST!!!
    TO USE:

    you need a text input box, marked with id="translateInput"
    you need a text output box, marked with id="translateOutput"
    you need a button, marked with id="translateButton"
    
    optional, set your settings using mistranslateSettings, as below
    also include <script src="src/main.js"></script>


    settings, which you can change as you need:

    languages: number of languages to translate through
    splitPercent: how split into chunks, translated individually, the text is
    leaveChance: the percent chance that a word will be left, not translated back to english
    continuous: whether to continuously translate the text, or just do it once
    continuousDelay: if continuous is true, how long to wait between translations
    continuousMaxLoops: if continuous is true, the maximum number of times to translate before repeating results
    translatingMessage: the message to show in the output box while translating, before showing results


    everything you need is in div below and main.js in src
    adapt the code below or write your own
    beware, the code looks for ids, so you cant have multiple inputs/outputs, so delete these if you want your own

    -->

            <div style="width: 25px"></div>

          <button id="translateButton" style="font-family: minecraftia; font-size: 20px; width: 30%; height: 50px; align-self: center; margin-top: 20px;">translate</button>

        <script>
          let mistranslateSettings = {

            continuous: false,

            translatingMessage: "translating..."
          };
        </script>
        <script src="src/main.js"></script>
      </div>
