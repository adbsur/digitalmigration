  <div class="item pop-in" style="top:89%; left:24%; transform:rotate(-8deg);" data-z="5"
       data-info="Benign masochism - the tendency to feel a sense of grounding in the things that feel displeasing. Is this how I learnt to cope with pain?  During the painful experiences, I learned how to become a person. It taught me the difference between living and dying. On regulating the nervous system: I learned to be in a permanent fight or flight. I stay at home most days, except to go to the market. If i need someone to talk to me or vice versa, I always bring myself lower than the other person.  i expect that whatever the situation is, I am in the wrong, not because I am but that it will make my life easier. I have children now to protect. Conditioning myself to anticipate an attack is how I ensure my safe route home. Because belonging relies on an ability to keep myself safe, but most importantly to find meaning in pain. You feel pain, you go through it before you get to the other side of it. There is no shame in being smaller than others. and on compromise... Are we allowing ourselves to be dehumanised, or are we holding onto our humanity?">

  <div class="item pop-in float-up" style="top:35%; left:24%; transform:rotate(5deg);" data-z="8"
       data-info="I've been thinking alot about resentment. It's very common, at least in asian households, to obey and fulfill the desires of your elders. its an admittance of wrong doing, that you're on the right path. I'm at a stage in my life where I've rejected womanhood, as a binary form but also a social role. What does that mean? I have learned that being a woman is suffering - an inherited suffering. It's a beautiful selflessness, but not different from wearing a mask. Womanhood should be a temporary thing, to learn about and ultimately grow out of. I can't completely admonish my mother though, for the experiences I've never had. I've beenn taught the fate of women leads to motherhood so i think the version of her that I encountered was someone who was pressured to be selfless and nurturing. How do i see her beyond the roles and performances she was given? I was confused. I dont want her fate, when the idea of womanhood looks like a cycle of violence and enduring.  i don't know how to take care of it either... I have to be alot more responsible than kids my age.">
    <img src="https://asjkndnkaof.carrd.co/assets/images/image14.png?v=5fd13bae" width="100" alt="download">
  </div>

  I used to be my own thing before I ended up here. I overstayed and as a consequence I was displaced to the liver. Now I cannot be severed from the body. I lost the will to differentiate myself from my host. Inside/outside, original/copy, mind/body

  <script>
    const infoBox = document.getElementById('info-box');
    const items = document.querySelectorAll('.item');

    items.forEach(item => {
      item.addEventListener('mouseenter', () => {
        infoBox.textContent = item.getAttribute('data-info');
        infoBox.classList.add('visible');
      });

      item.addEventListener('mouseleave', () => {
        infoBox.classList.remove('visible');
        infoBox.textContent = '';
      });
    });
  </script>
