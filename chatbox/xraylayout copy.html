      <div class="item pop-in" style="top:-100px; left:30%; transform:rotate(-0deg); position: relative;" data-z="5"
          data-info="<p>Benign masochism - the tendency to feel grounded in the things that hurt. <br>During the painful experiences, I learned how to become a person. <br>On regulating the nervous system: I learned to be in a permanent fight or flight.<br> I live in fight or flight the way other people live in houses.<br> I stay home most days. <br> when I do need someone, I make myself smaller first — position myself below them before they can do it to me. <br> I assume I am wrong. not because I am, but because it is safer. I have children now.<br> the calculus has changed. anticipating the worst is not pessimism. <br> it is how I find the safe route home.<br> belonging, I have learned, requires the ability to find meaning in the thing that is hurting you.<br> you go through the pain. there is no other way to the other side of it. there is no shame in being smaller. <br>and on compromise — I am still not sure whether I have been surviving, or slowly agreeing to disappear.</p>">
        <img src="https://asjkndnkaof.carrd.co/assets/images/image15.png?v=5fd13bae" width="100" alt="spinning globe">
      </div>

      <!-- torso -->
      <div class="item pop-in float-up" style="top:-480px; left:35%; transform:rotate(2deg) scale(1.1, 1.1); position: relative" data-z="8"
          data-info="<p>I've been thinking about resentment for a long time. <br>In the household I grew up in, obedience was how you proved yourself to others. <br>Now I believe compliance is an admittance of wrong doing.<br> I'm at a stage in my life where I've rejected womanhood. <br>I have learned that being a woman is suffering - an inheritance. <br>It's a beautiful selflessness, but not different from wearing a mask.<br> Womanhood should be a temporary thing, to learn about and ultimately grow out of. <br> As for the experiences I've never had - I've beenn taught the fate of women leads to motherhood: pressed to be soft, to give, to disappear into nuturing. <br>How do i see her beyond the role she she was given? <br>The idea of womanhood looks like a cycle of violence and enduring... <br> I have to be alot more responsible than kids my age.</p>">
        <img src="https://asjkndnkaof.carrd.co/assets/images/image14.png?v=5fd13bae" width="100" alt="download">
      </div>

      <!-- lizard -->
      <div class="item pop-in" style="top:-790px; left:10%; transform:rotate(-80deg)  scale(0.8,-0.8); position: relative; " data-z="22"
          data-info="<p>Parasitic creature:<br><br> I was something before I arrived here.<br> I don't remember what. I overstayed and as a consequence was displaced deeper into the body. Now I cannot be severed without damaging the host.<br> I lost the will to differentiate myself anymore, they debate on whether I belong- I don't care anymore.<br> Inside/outside, original/copy, self/other 
  <br>These boundaries were drawn before I was born and I have spend my whole life being sorted into the wrong side of them. Yet here I still am. <br>Is my existence an anomaly?<br> Or am I simply proof that all organisms need to change form? <br> The body is simply changing, the way all bodies do, into something it hasn't been before...</p> ">

  <script>
    const infoBox = document.getElementById('info-box');
    const items = document.querySelectorAll('.item');

items.forEach(item => {
  item.addEventListener('mouseenter', () => {
  infoBox.innerHTML = item.getAttribute('data-info'); 
  infoBox.classList.add('visible');
});

item.addEventListener('mouseleave', () => {
  infoBox.classList.remove('visible');
  infoBox.innerHTML = ''; 
});
});
</script>
