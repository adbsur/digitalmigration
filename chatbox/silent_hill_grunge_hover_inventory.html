<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}

  .sh-root {
    background: #080706;
    border: 2px solid #1a1210;
    font-family: 'Share Tech Mono', monospace;
    position: relative;
    overflow: hidden;
  }

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px);
    pointer-events: none; z-index: 20;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none; z-index: 19;
  }
  .scratch-layer {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 18; overflow: hidden;
  }

  .rust-border-top {
    height: 6px; background: #1a0e0a;
    border-bottom: 1px solid #2d1a10;
    position: relative; overflow: hidden;
  }
  .rust-streak {
    position: absolute; top: 0; bottom: 0;
    background: #3a1a0a; opacity: 0.6;
  }
  .noise-bar {
    height: 2px; background: #0e0a06;
    position: relative; overflow: hidden;
    border-bottom: 1px solid #160e08;
  }
  .noise-pulse {
    height: 100%; background: #2a1208; width: 20%;
    animation: noisepulse 3s ease-in-out infinite;
  }
  @keyframes noisepulse {
    0%{transform:translateX(-100%);opacity:.3} 50%{opacity:1} 100%{transform:translateX(600%);opacity:.3}
  }

  .sh-header {
    background: #0a0807; border-bottom: 1px solid #1a1008;
    padding: 10px 16px 8px;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .title-block { display: flex; flex-direction: column; gap: 3px; }
  .sh-game-title {
    font-family: 'Special Elite', serif;
    color: #b8946a; font-size: 18px; letter-spacing: 5px;
  }
  .sh-subtitle { color: #3a2a1a; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
  .sh-star { color: #4a2a1a; font-size: 10px; letter-spacing: 6px; margin-top: 2px; }
  .status-block { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .health-row { display: flex; align-items: center; gap: 8px; }
  .health-label { color: #3a2018; font-size: 10px; letter-spacing: 2px; }
  .health-track {
    width: 90px; height: 8px; background: #0e0a06;
    border: 1px solid #2a1408; position: relative; overflow: hidden;
  }
  .health-fill { height: 100%; width: 38%; background: #7a1a08; }
  .health-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: #0e0a06; }
  .caution-text {
    color: #c0392b; font-size: 10px; letter-spacing: 2px;
    animation: flicker 1.6s step-start infinite;
  }
  @keyframes flicker { 0%,100%{opacity:1} 20%{opacity:.2} 40%{opacity:1} 60%{opacity:.4} 80%{opacity:1} }
  .loc-text { color: #2a1a0e; font-size: 10px; letter-spacing: 1px; }
  .radio-row { display: flex; align-items: center; gap: 5px; }
  .radio-pip {
    width: 5px; height: 5px; border-radius: 50%; background: #8b1a1a;
    animation: pip .9s step-start infinite;
  }
  @keyframes pip { 0%,100%{opacity:1} 50%{opacity:.1} }
  .radio-label { color: #6a1a1a; font-size: 9px; letter-spacing: 2px; animation: pip .9s step-start infinite; }

  .sh-body { padding: 12px 14px 14px; }
  .section-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; border-bottom: 1px solid #160e08; padding-bottom: 6px;
  }
  .section-label { color: #3a2214; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; }
  .section-count { color: #261a0e; font-size: 10px; }

  .carousel-outer { overflow: hidden; position: relative; }
  .carousel-track {
    display: flex; gap: 8px;
    transition: transform 0.4s cubic-bezier(0.23,1,0.32,1);
  }

  .sh-slot {
    flex: 0 0 146px;
    background: #0a0806; border: 1px solid #1e1208;
    padding: 9px; cursor: pointer; position: relative;
    transition: border-color 0.25s;
  }
  .sh-slot::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: #1e1208; transition: background 0.25s;
  }
  .sh-slot:hover { border-color: #5a2a10; }
  .sh-slot:hover::before { background: #5a2a10; }
  .sh-slot.selected { border-color: #8b3010; background: #0d0a06; }
  .sh-slot.selected::before { background: #c0392b; }

  .sel-corner { position: absolute; width: 6px; height: 6px; border-color: #8b3010; border-style: solid; opacity: 0; transition: opacity .2s; }

  .sel-corner.tl{top:3px;left:3px;border-width:1px 0 0 1px;}
  .sel-corner.tr{top:3px;right:3px;border-width:1px 1px 0 0;}
  .sel-corner.bl{bottom:3px;left:3px;border-width:0 0 1px 1px;}
  .sel-corner.br{bottom:3px;right:3px;border-width:0 1px 1px 0;}

  .item-frame {
    width: 100%; aspect-ratio: 1;
    background: #060504; border: 1px solid #160e06;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px; position: relative; overflow: visible;
  }
  .item-frame::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(-45deg,transparent,transparent 6px,rgba(255,255,255,.008) 6px,rgba(255,255,255,.008) 7px);
  }
  .item-frame::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.55) 100%);
  }
  .item-svg { width: 56px; height: 56px; position: relative; z-index: 1; }

  .item-badge {
    position: absolute; bottom: 3px; right: 3px; z-index: 2;
    font-size: 8px; padding: 1px 4px; letter-spacing: 1px; text-transform: uppercase;
  }
  .b-weapon{background:#1a0404;color:#9a2a2a;border-top:1px solid #5a1010;}
  .b-med{background:#041208;color:#2a7a40;border-top:1px solid #105a20;}
  .b-ammo{background:#080818;color:#4a4aaa;border-top:1px solid #20205a;}
  .b-key{background:#140e00;color:#9a7020;border-top:1px solid #5a4010;}
  .b-note{background:#100c08;color:#6a5a48;border-top:1px solid #302820;}

  .item-name { color: #8a7060; font-size: 11px; line-height: 1.3; margin-bottom: 3px; }
  .item-qty  { color: #2e2018; font-size: 10px; }

  .nav-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding-top: 8px; border-top: 1px solid #160e08;
  }
  .nav-hint { color: #2e1e10; font-size: 10px; letter-spacing: 2px; }
  .nav-btns { display: flex; gap: 6px; align-items: center; }
  .nav-btn {
    background: #0a0806; border: 1px solid #1e1208;
    color: #4a3020; font-family: 'Share Tech Mono', monospace;
    font-size: 13px; width: 26px; height: 26px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color .2s, color .2s;
  }
  .nav-btn:hover:not(:disabled) { border-color: #8b3010; color: #c0392b; }
  .nav-btn:disabled { opacity: .2; cursor: default; }
  .page-ind { color: #2e1e10; font-size: 10px; letter-spacing: 1px; min-width: 30px; text-align: center; }

  .detail-panel {
    margin-top: 12px; background: #080604;
    border: 1px solid #160e08; border-top: 1px solid #2d1408;
    padding: 12px 14px 14px; min-height: 116px; position: relative;
  }

    content: ''; position: absolute; top: 0; left: 0; width: 40px; height: 1px;
    background: #c0392b;
  }

  .detail-radio {

  .detail-desc {
    color: #3a2a1a; font-size: 11px; line-height: 1.75; margin-bottom: 10px;
    border-left: 2px solid #1a0e08; padding-left: 8px;
  }
 


  .blood-drip { position: absolute; top: 0; width: 1px; background: #5a0a0a; opacity: .4; }

  /* ── HOVER POPUP ── */
  .item-popup {
    display: none;
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0.92);
    width: 220px;
    background: #080604;
    border: 1px solid #3a1a08;
    border-top: 2px solid #0aec87;
    padding: 12px;
    z-index: 200;
    pointer-events: none;
    transition: transform 0.18s ease, opacity 0.18s ease;

  }
  .item-popup.visible {
    display: block;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);

  .popup-corner.tr{top:4px;right:4px;border-width:1px 1px 0 0;}
  .popup-corner.bl{bottom:4px;left:4px;border-width:0 0 1px 1px;}
  .popup-corner.br{bottom:4px;right:4px;border-width:0 1px 1px 0;}

    margin-bottom: 10px;
    position: relative;

    content: ''; position: absolute; inset: 0;

    color: #3a1a0a; font-size: 9px; letter-spacing: 3px; text-transform: uppercase;

  .popup-name {
    font-family: 'Special Elite', serif;

  }
  .popup-flavour {
    color: #4a3020; font-size: 10px; line-height: 1.7;
    margin-bottom: 8px;
  }
 
 

  .popup-tag {
    display: inline-block; font-size: 8px; padding: 1px 5px;
    letter-spacing: 1px; text-transform: uppercase;
    margin-top: 7px;
  }

  .carousel-outer { overflow: visible !important; }
</style>

const VISIBLE = 4;
const PAGES = Math.ceil(ITEMS.length / VISIBLE);
let page = 0, sel = 0;
let activePopup = null;

const track = document.getElementById('carTrack');
const outer = document.getElementById('carOuter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageInd = document.getElementById('pageInd');

function buildSlots() {
  track.innerHTML = '';
  ITEMS.forEach((item, i) => {
    const slot = document.createElement('div');
    slot.className = 'sh-slot' + (i === sel ? ' selected' : '');
    slot.setAttribute('role','button');
    slot.setAttribute('aria-label', item.name);
    slot.tabIndex = 0;

    const badgeHtml = `<div class="item-badge ${item.bc}">${item.badge}</div>`;
    const popupHtml = `
      <div class="item-popup" id="popup-${i}">
        <div class="popup-scan"></div>
        <div class="popup-corner tl"></div><div class="popup-corner tr"></div>
        <div class="popup-corner bl"></div><div class="popup-corner br"></div>
        <div class="popup-examine">&#9632; examining</div>
        <div class="popup-art">
          <svg viewBox="0 0 120 120" class="popup-art-svg" xmlns="http://www.w3.org/2000/svg">${item.bigSvg.replace(/<svg[^>]*>/,'').replace('</svg>','')}</svg>
        </div>
        <div class="popup-name">${item.name}</div>
<div class="popup-flavour">${item.flavour}</div>

<div class="popup-tag ${item.bc}">${item.badge}</div>
      </div>
    `;

    slot.innerHTML = `
      <div class="sel-corner tl"></div><div class="sel-corner tr"></div>
      <div class="sel-corner bl"></div><div class="sel-corner br"></div>
      <div class="item-frame">
        ${item.svg}
        ${badgeHtml}
        ${popupHtml}
      </div>
      <div class="item-name">${item.name}</div>
      <div class="item-qty">${item.qty}</div>
    `;

    const frame = slot.querySelector('.item-frame');
    const popup = slot.querySelector('.item-popup');

    frame.addEventListener('mouseenter', () => {
      if(activePopup && activePopup !== popup) activePopup.classList.remove('visible');
      popup.classList.add('visible');
      activePopup = popup;
    });
    frame.addEventListener('mouseleave', () => {
      popup.classList.remove('visible');
      if(activePopup === popup) activePopup = null;
    });

    slot.addEventListener('click', () => pick(i));
    slot.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') pick(i); });
    track.appendChild(slot);
  });
}

function goPage(p) {
  page = Math.max(0, Math.min(PAGES-1, p));
  const w = 146+8;
  track.style.transform = `translateX(-${page*VISIBLE*w}px)`;
  prevBtn.disabled = page === 0;
  nextBtn.disabled = page === PAGES-1;
  pageInd.textContent = (page+1)+' / '+PAGES;
}

function pick(i) {
  sel = i;
  document.querySelectorAll('.sh-slot').forEach((s,idx) => s.classList.toggle('selected', idx===i));
  updateDetail();
  const p = Math.floor(i/VISIBLE);
  if(p !== page) goPage(p);
}

function updateDetail() {
  const item = ITEMS[sel];
  document.getElementById('dName').textContent = item.name;
  document.getElementById('dDesc').textContent = item.desc;
}

const outerW = VISIBLE*146 + (VISIBLE-1)*8;
outer.style.width = outerW+'px';
outer.style.margin = '0 auto';

buildSlots();
goPage(0);
updateDetail();

prevBtn.addEventListener('click', () => goPage(page-1));
nextBtn.addEventListener('click', () => goPage(page+1));
</script>
</html>
