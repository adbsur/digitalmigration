<script>
const dialogue = [
  {
    speaker: "Director",
    text: " I wanted to pull you aside to discuss the revisions to the script. There’s been some concern about the tone of the film. There have been some calls for it to be less fluid and for it to have more historical and geographical groundwork. So we’ve decided to go with 1850’s Mississippi, reimagined as a drama. It's going to be an adventure film under a revival of the modern hero, starring in the classic - Spaghetti Western! <br> PRESS ▶ TO CONTINUE </br>  "
  },
  { speaker: "Director",
    text: "Now, I know from our last conversation you wanted something more 'true' to your life - and I'm not dismissing that - but the team felt that your desire to convey <br> <em>(looks down at notes)</em> </br> the metaphysical shifts and anxieties of immigrants' is, while intellectually interesting, particularly symbolic. Abstract. What we need is physical imagery. Real, visceral — <em>grotesque</em> at times, yes — because that is how we accurately capture a period defined by violence, brutality, and oppression."
  },
  {
    speaker: "Director",
    text: "I <em>hear</em> your concerns, I do - The script is somehow lacking your personhood. But this is precisely what I want to address, because I think it comes from a misunderstanding of what we're building. If you want to utilise the real power your story, you need to embrace the universality of the message. That is where the real power lives. Would a regular viewer understand what you're saying? To be honest with you, it sounds like what you want to make instead is an art film. For the commercial audience, for <em>this</em> audience, there needs to be a distinct separation - <em> art as fiction, documentary as presumed truth.</em>" 
  },

  { speaker: "Director",
    text: "The self-sacrificing protagonist, the crisis-driven arc, the emotional catharsis - these things work because they are universal. They transcend culture and specificity. In the Western imagination, the archetype of the hero carries the moral weight, absorbs the grief, restores order - all so that  the audience can leave the cinema feeling changed. And that is what I do. I change people."
  },

   { speaker: "Director",
    text: " Yes, it's an aesthetic shaped to fit mainstream tastes. But representation cannot carry the entire burden of justice — that is too much to ask of a single film. What we offer is a singular version of the truth. You speak of misremembered histories — well, cinema is not for that. It is fiction-making. A performance of violence, where real-world conflict gets no resolution. This film exists to satiate. My advice is to dissociate yourself from it. It does not represent the thing, it <em> is </em> the thing. There is something fundamentally irrational about committing yourself entirely to fictitious characters."
  },

  {
    speaker: "You",
    text: "...So my family's trauma is a backdrop for your creative vision. I'll find someone else to direct my film — someone who won't exploit me and then explain why that would be a privilege."
},

];

let index = -1;
let typing = false;
let currentText = "";
let typeTimeout = null;

const box = document.getElementById("dialogueBox");
const speakerEl = document.getElementById("speaker");
const textEl = document.getElementById("text");


// ▶ TYPE TEXT FUNCTION
function typeText(fullText) {
  typing = true;
  currentText = fullText;
  textEl.innerHTML = "";

  // Strip tags to get plain text for typing, but keep HTML for final render
  const temp = document.createElement("div");
  temp.innerHTML = fullText;
  const plainText = temp.textContent;

  let i = 0;

  function addChar() {
    // Type plain text but reveal HTML progressively
    const ratio = i / plainText.length;
    const charCount = Math.floor(ratio * fullText.length);
    textEl.innerHTML = fullText.substring(0, charCount);
    i++;

    if (i <= plainText.length) {
      typeTimeout = setTimeout(addChar, 25);
    } else {
      textEl.innerHTML = fullText; // ensure final render is complete
      typing = false;
    }
  }

  addChar();
}


// ▶ SKIP TYPE FUNCTION (IMPORTANT FIX)
function skipTyping() {
  clearTimeout(typeTimeout);       // stop animation loop
  textEl.innerHTML = currentText;  // show full text instantly
  typing = false;
}


// ▶ NEXT LINE FUNCTION
function nextLine() {
  index++;

  if (index >= dialogue.length) {
    speakerEl.innerText = "";
    textEl.innerText = "(End)";
    return;
  }

  const line = dialogue[index];

  speakerEl.innerText = line.speaker;
  typeText(line.text);
}


// ▶ INPUT HANDLER (CLICK / KEYBOARD)
function advance() {
  if (typing) {
    skipTyping();
  } else {
    nextLine();
  }
}



// ▶ FORWARD BUTTON SUPPORT
const forwardBtn = document.getElementById("forwardButton");

forwardBtn.addEventListener("click", function(e) {
  
     e.stopPropagation();
    advance();
  
});


// ▶ START GAME
nextLine();
</script>
</body>
